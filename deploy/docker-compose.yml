# The Endod super admin (admin.endod-health.com): its own Postgres, the API
# and the web app.
#
# It shares nothing with the hospital service or TenaCare but their platform
# APIs, reached on the private "endod-bus" network (no internet) as
# endod-hospital-api and endod-organisation-api. The web
# app joins the shared nginx edge network as "endod-admin"; nginx terminates
# TLS for admin.endod-health.com and proxies to http://endod-admin:3000.
#
#   cd deploy && cp .env.example .env   # then fill it in
#   docker compose --env-file .env up -d --build
#   docker compose exec api python -m app.cli create-admin --email you@endod-health.com --name "Your Name"
#
# Database roles (deploy/postgres-init/10-roles.sh, run when the volume is
# first created): the one-shot `migrate` service runs Alembic as admin_owner;
# the API connects as admin_app, which cannot change the schema and can only
# read and append to the audit log.

name: endod-admin

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: admin
      # The superuser: only for the init script and emergencies; no app uses it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      ADMIN_OWNER_PASSWORD: ${ADMIN_OWNER_PASSWORD:?set ADMIN_OWNER_PASSWORD in deploy/.env}
      ADMIN_APP_PASSWORD: ${ADMIN_APP_PASSWORD:?set ADMIN_APP_PASSWORD in deploy/.env}
    volumes:
      - admin_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admin"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applies the Alembic migrations as the owner role, then exits. `up` runs it
  # again each time; the API starts only after it succeeded.
  migrate:
    build: ../backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      ADMIN_ENVIRONMENT: production
      ADMIN_DATABASE_URL: ${ADMIN_MIGRATE_DATABASE_URL:?set ADMIN_MIGRATE_DATABASE_URL (the admin_owner role) in deploy/.env}
      ADMIN_APP_ROLE: admin_app
    networks: [default]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      ADMIN_ENVIRONMENT: production
      # The admin_app role (not the owner, not the superuser).
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:?set ADMIN_DATABASE_URL (the admin_app role) in deploy/.env}
      HOSPITAL_API_URL: ${HOSPITAL_API_URL:-http://endod-hospital-api:8000}
      HOSPITAL_PLATFORM_KEY: ${HOSPITAL_PLATFORM_KEY:?set HOSPITAL_PLATFORM_KEY (the hospital service's PLATFORM_ADMIN_KEY)}
      # TenaCare's platform API (company applications), docs/company-onboarding.md.
      # Optional: without the key the company pages say "not connected yet".
      ORGANISATION_API_URL: ${ORGANISATION_API_URL:-http://endod-organisation-api:8000}
      ORGANISATION_PLATFORM_KEY: ${ORGANISATION_PLATFORM_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (at least 32 random characters)}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://admin.endod-health.com}
      # Only the web app knows it: anything else reaching this API (other
      # services on endod-bus) is refused, and only the web app names the visitor.
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?set BFF_SHARED_SECRET (at least 32 random characters)}
    networks:
      default: {}
      # Only to reach endod-hospital-api and endod-organisation-api; never published.
      bus: {}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ..
    restart: unless-stopped
    environment:
      ADMIN_API_URL: http://api:8000
      SITE_ORIGIN: ${SITE_ORIGIN:-https://admin.endod-health.com}
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?set BFF_SHARED_SECRET (at least 32 random characters)}
      # nginx sends it as X-Endod-Edge-Key; anything else on the shared edge
      # network calling endod-admin:3000 directly gets 403.
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?set EDGE_SHARED_SECRET (at least 32 random characters, the same as in the nginx config)}
    networks:
      default: {}
      shared_edge:
        aliases: [endod-admin]
    depends_on:
      api:
        condition: service_healthy

volumes:
  admin_pgdata:

networks:
  default: {}
  bus:
    external: true
    name: endod-bus
  shared_edge:
    external: true
    name: ${SHARED_NGINX_NETWORK:-eyita_edge}
